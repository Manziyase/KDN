<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BizTrack Lite — simple shop management for small businesses: sales, expenses, inventory, customers and cash flow.">
  <title>BizTrack Lite</title>

  <!-- Tabler Icons webfont -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- App styles (load order matters) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/extras.css">
</head>

<body>
  <div class="app">

    <!-- Mobile overlay for the off-canvas sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="sidebar-brand" href="#/home" aria-label="BizTrack Lite home">
        <span class="brand-dot"></span>
        <span class="brand-name">BizTrack <small>Lite</small></span>
      </a>

      <nav class="sidebar-nav">
        <p class="nav-section">Overview</p>
        <a href="#/dashboard">
          <i class="ti ti-home" aria-hidden="true"></i><span>Dashboard</span>
        </a>

        <p class="nav-section">Daily work</p>
        <a href="#/new-sale">
          <i class="ti ti-shopping-cart" aria-hidden="true"></i><span>New sale</span>
        </a>
        <a href="#/new-expense">
          <i class="ti ti-receipt" aria-hidden="true"></i><span>New expense</span>
        </a>
        <a href="#/add-payment">
          <i class="ti ti-coin" aria-hidden="true"></i><span>Add payment</span>
        </a>

        <p class="nav-section">Manage</p>
        <a href="#/inventory">
          <i class="ti ti-box" aria-hidden="true"></i><span>Inventory</span>
        </a>
        <a href="#/boxes">
          <i class="ti ti-wallet" aria-hidden="true"></i><span>Money boxes</span>
        </a>
        <a href="#/customers">
          <i class="ti ti-users" aria-hidden="true"></i><span>Customers</span>
        </a>
        <a href="#/ledger">
          <i class="ti ti-book" aria-hidden="true"></i><span>Cash ledger</span>
        </a>
        <a href="#/expenses">
          <i class="ti ti-cash" aria-hidden="true"></i><span>Expenses</span>
        </a>

        <p class="nav-section">General</p>
        <a href="#/notifications">
          <i class="ti ti-bell" aria-hidden="true"></i><span>Notifications</span>
          <span class="nav-count" id="nav-count" hidden>0</span>
        </a>
        <a href="#/settings">
          <i class="ti ti-settings" aria-hidden="true"></i><span>Settings</span>
        </a>
        <a href="#/profile">
          <i class="ti ti-user-cog" aria-hidden="true"></i><span>My profile</span>
        </a>
        <button class="nav-signout" id="signout-btn" type="button">
          <i class="ti ti-logout" aria-hidden="true"></i><span>Sign out</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <a class="account-chip" id="account-chip" href="#/profile"
           aria-label="Open my profile" title="My profile">
          <span class="avatar">BT</span>
          <div class="sidebar-user">
            <strong id="user-name">BizTrack Lite</strong>
            <small id="user-email">Offline demo mode</small>
          </div>
        </a>
        <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">
          <i class="ti ti-settings" aria-hidden="true"></i>
        </a>
      </div>
    </aside>

    <!-- ============ Main column ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button"
                aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
          <i class="ti ti-menu-2" aria-hidden="true"></i>
        </button>

        <h1 class="page-title" id="page-title">Dashboard</h1>

        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
          <a class="icon-btn" href="#/notifications" aria-label="Notifications">
            <i class="ti ti-bell" aria-hidden="true"></i>
            <span class="dot" id="bell-dot" hidden></span>
          </a>
          <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">
            <i class="ti ti-settings" aria-hidden="true"></i>
          </a>
          <a class="avatar avatar-sm" href="#/profile" aria-label="My profile" title="My profile">BT</a>
        </div>
      </header>

      <main class="page" id="page" tabindex="-1"></main>

      <footer class="app-footer">
        BizTrack Lite · vanilla HTML / CSS / JS · <span id="conn-status">connecting…</span>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- App scripts — plain scripts (no build step), load order matters -->
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/signin.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/new-sale.js"></script>
  <script src="js/pages/new-expense.js"></script>
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/ledger.js"></script>
  <script src="js/pages/add-payment.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/boxes.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
